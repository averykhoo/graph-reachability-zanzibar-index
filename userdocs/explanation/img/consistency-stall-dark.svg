<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 232" width="920" height="232" role="img">
<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .bgr{fill:#1a1c1e;stroke:#3d444d} .band{fill:#212529;stroke:none} .n{fill:#22272e;stroke:#768390;stroke-width:1.3} .gh{fill:none;stroke:#768390;stroke-width:1.3} .lf{fill:#3b3418;stroke:#768390;stroke-width:1.3} .dv{fill:#13304f;stroke:#4493f8;stroke-width:1.5} .wd{fill:#38254d;stroke:#ab7df8;stroke-width:1.5} .cell{fill:#22272e;stroke:#3d444d} .hl{fill:#13304f;stroke:#4493f8} .lf2{fill:#3b3418;stroke:#3d444d} .bad{fill:#4c1d1f;stroke:#f85149} .bdg{fill:#22272e;stroke-width:1.4} .ln{fill:none;stroke-linecap:round} .s-ink{stroke:#e6edf3} .c-ink{fill:#e6edf3} .s-muted{stroke:#9198a1} .c-muted{fill:#9198a1} .s-blue{stroke:#4493f8} .c-blue{fill:#4493f8} .s-orange{stroke:#f0883e} .c-orange{fill:#f0883e} .s-green{stroke:#3fb950} .c-green{fill:#3fb950} .s-red{stroke:#f85149} .c-red{fill:#f85149} .s-purple{stroke:#ab7df8} .c-purple{fill:#ab7df8}</style>
<defs><marker id="h-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6edf3"/></marker><marker id="h-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker><marker id="h-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="h-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ab7df8"/></marker></defs>
<rect class="bgr" x="0.5" y="0.5" width="919" height="231" rx="10"/>
<text class="s c-ink" x="24.0" y="34.0" font-size="12.5" text-anchor="start" font-weight="600">a stall: one row cannot be applied, so nothing after it can be</text>
<rect class="hl" x="24" y="60" width="70" height="34" rx="0"/>
<text class="m c-ink" x="59.0" y="81.5" font-size="11.5" text-anchor="middle">row 1</text>
<rect class="hl" x="94" y="60" width="70" height="34" rx="0"/>
<text class="m c-ink" x="129.0" y="81.5" font-size="11.5" text-anchor="middle">row 2</text>
<rect class="hl" x="164" y="60" width="70" height="34" rx="0"/>
<text class="m c-ink" x="199.0" y="81.5" font-size="11.5" text-anchor="middle">row 3</text>
<rect class="bad" x="234" y="60" width="70" height="34" rx="0"/>
<text class="m c-ink" x="269.0" y="81.5" font-size="11.5" text-anchor="middle">row 4</text>
<rect class="lf2" x="304" y="60" width="70" height="34" rx="0"/>
<text class="m c-ink" x="339.0" y="81.5" font-size="11.5" text-anchor="middle">row 5</text>
<rect class="lf2" x="374" y="60" width="70" height="34" rx="0"/>
<text class="m c-ink" x="409.0" y="81.5" font-size="11.5" text-anchor="middle">row 6</text>
<rect class="lf2" x="444" y="60" width="70" height="34" rx="0"/>
<text class="m c-ink" x="479.0" y="81.5" font-size="11.5" text-anchor="middle">row 7</text>
<path class="c-blue" d="M234.0,98.0 l-7,12 h14 z"/>
<text class="s c-blue" x="234.0" y="126.0" font-size="11.5" text-anchor="middle" font-weight="600">cursor</text>
<text class="s c-red" x="269.0" y="140.0" font-size="12.5" text-anchor="middle" font-weight="600">fails</text>
<text class="s c-muted" x="409.0" y="120.0" font-size="11.5" text-anchor="middle">wait behind it, revokes too</text>
<text class="s c-muted" x="540.0" y="74.0" font-size="11.5" text-anchor="start">The stall is recorded on the cursor row, so every</text>
<text class="s c-muted" x="540.0" y="92.0" font-size="11.5" text-anchor="start">instance sees it. While it lasts:</text>
<text class="m c-ink" x="540.0" y="116.0" font-size="11.5" text-anchor="start">check without a token</text>
<text class="m c-ink" x="728.0" y="116.0" font-size="11.5" text-anchor="start">→ set engine</text>
<text class="m c-ink" x="540.0" y="136.0" font-size="11.5" text-anchor="start">lookup without a token</text>
<text class="m c-ink" x="728.0" y="136.0" font-size="11.5" text-anchor="start">→ IndexStalled</text>
<text class="m c-ink" x="540.0" y="156.0" font-size="11.5" text-anchor="start">sync=True writes</text>
<text class="m c-ink" x="728.0" y="156.0" font-size="11.5" text-anchor="start">→ refused</text>
<text class="s c-muted" x="24.0" y="196.0" font-size="11.5" text-anchor="start">It ends at the next catch_up() that applies a row; a row that can never be applied (PathCountExceeded)</text>
<text class="s c-muted" x="24.0" y="214.0" font-size="11.5" text-anchor="start">needs the tuple removed and the index rebuilt with rebuild_index().</text>
</svg>

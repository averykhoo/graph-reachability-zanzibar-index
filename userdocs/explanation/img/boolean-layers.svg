<text class="m c-ink" x="700.0" y="374.5" font-size="12.5" text-anchor="middle">doc:1#commenter.0</text>
<text class="m c-muted" x="700.0" y="390.5" font-size="11.5" text-anchor="middle">verified tuples</text>
<path class="ln s-blue" d="M270.0,355.0 Q301.7,327.0 333.4,299.0" stroke-width="1.6" marker-end="url(#h-blue)"/>
<text class="s c-blue" x="281.7" y="331.0" font-size="11.5" text-anchor="middle">keep</text>
<path class="ln s-red" d="M480.0,355.0 Q453.3,327.0 426.6,299.0" stroke-width="1.6" marker-end="url(#h-red)"/>
<text class="s c-red" x="481.3" y="331.0" font-size="11.5" text-anchor="middle">but not</text>
<path class="ln s-blue" d="M380.0,253.0 Q449.2,225.0 518.4,197.0" stroke-width="1.6" marker-end="url(#h-blue)"/>
<text class="s c-blue" x="431.2" y="229.0" font-size="11.5" text-anchor="middle">and</text>
<path class="ln s-blue" d="M700.0,355.0 Q650.8,276.0 601.6,197.0" stroke-width="1.6" marker-end="url(#h-blue)"/>
<text class="s c-blue" x="668.8" y="280.0" font-size="11.5" text-anchor="middle">and</text>
<text class="s c-muted" x="760.0" y="166.0" font-size="11.5" text-anchor="start">derived edges</text>

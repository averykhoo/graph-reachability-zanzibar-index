<text class="s c-muted" x="760.0" y="268.0" font-size="11.5" text-anchor="start">derived edges</text>
<text class="s c-muted" x="760.0" y="284.0" font-size="11.5" text-anchor="start">+ residue</text>
<text class="s c-muted" x="24.0" y="450.0" font-size="11.5" text-anchor="start">Leaves (yellow) are internal relations with ordinary closure rows. Derived relations (blue) are written by the delta processor.</text>

<text class="m c-ink" x="380.0" y="272.5" font-size="12.5" text-anchor="middle">doc:1#viewer</text>
<text class="m c-muted" x="380.0" y="288.5" font-size="11.5" text-anchor="middle">viewer.0 but not viewer.1</text>

<text class="m c-ink" x="270.0" y="374.5" font-size="12.5" text-anchor="middle">doc:1#viewer.0</text>
<text class="m c-muted" x="270.0" y="390.5" font-size="11.5" text-anchor="middle">viewer tuples</text>

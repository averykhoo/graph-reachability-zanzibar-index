<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img">
<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .bgr{fill:#fbfcfd;stroke:#d0d7de} .band{fill:#f2f4f6;stroke:none} .n{fill:#ffffff;stroke:#8c959f;stroke-width:1.3} .gh{fill:none;stroke:#8c959f;stroke-width:1.3} .lf{fill:#fff8c5;stroke:#8c959f;stroke-width:1.3} .dv{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5} .wd{fill:#fbefff;stroke:#8250df;stroke-width:1.5} .cell{fill:#ffffff;stroke:#d0d7de} .hl{fill:#ddf4ff;stroke:#0969da} .bdg{fill:#ffffff;stroke-width:1.4} .ln{fill:none;stroke-linecap:round} .s-ink{stroke:#1f2328} .c-ink{fill:#1f2328} .s-muted{stroke:#59636e} .c-muted{fill:#59636e} .s-blue{stroke:#0969da} .c-blue{fill:#0969da} .s-orange{stroke:#bc4c00} .c-orange{fill:#bc4c00} .s-green{stroke:#1a7f37} .c-green{fill:#1a7f37} .s-red{stroke:#cf222e} .c-red{fill:#cf222e} .s-purple{stroke:#8250df} .c-purple{fill:#8250df}</style>
<defs><marker id="h-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="h-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="h-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="h-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker></defs>
<rect class="bgr" x="0.5" y="0.5" width="919" height="469" rx="10"/>
<text class="s c-ink" x="24.0" y="34.0" font-size="12.5" text-anchor="start" font-weight="600">schema</text>
<text class="m c-ink" x="24.0" y="58.0" font-size="12.5" text-anchor="start">define banned: [user]</text>
<text class="m c-ink" x="24.0" y="77.0" font-size="12.5" text-anchor="start">define verified: [user]</text>
<text class="m c-ink" x="24.0" y="96.0" font-size="12.5" text-anchor="start">define viewer: [user] but not banned</text>
<text class="m c-ink" x="24.0" y="115.0" font-size="12.5" text-anchor="start">define commenter: viewer and verified</text>
<text class="s c-muted" x="420.0" y="52.0" font-size="12.5" text-anchor="start">Each layer is computed only from layers below it,</text>
<text class="s c-muted" x="420.0" y="71.0" font-size="12.5" text-anchor="start">and is complete before the next layer reads it.</text>
<rect class="band" x="12" y="130" width="896" height="88" rx="8"/>
<text class="s c-ink" x="28.0" y="156.0" font-size="12.5" text-anchor="start" font-weight="600">layer 2</text>
<text class="s c-muted" x="28.0" y="174.0" font-size="11.5" text-anchor="start">derived: commenter</text>
<rect class="band" x="12" y="232" width="896" height="88" rx="8"/>
<text class="s c-ink" x="28.0" y="258.0" font-size="12.5" text-anchor="start" font-weight="600">layer 1</text>
<text class="s c-muted" x="28.0" y="276.0" font-size="11.5" text-anchor="start">derived: viewer</text>
<rect class="band" x="12" y="334" width="896" height="88" rx="8"/>
<text class="s c-ink" x="28.0" y="360.0" font-size="12.5" text-anchor="start" font-weight="600">layer 0</text>
<text class="s c-muted" x="28.0" y="378.0" font-size="11.5" text-anchor="start">the closure (path counting)</text>

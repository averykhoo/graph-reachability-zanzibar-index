<text class="m c-ink" x="560.0" y="170.5" font-size="12.5" text-anchor="middle">doc:1#commenter</text>
<text class="m c-muted" x="560.0" y="186.5" font-size="11.5" text-anchor="middle">viewer and commenter.0</text>

<path class="ln s-blue" d="M810.5,200.5 Q682.8,245.7 555.0,290.8" stroke-width="1.6" marker-end="url(#h-blue)"/>
<text class="s c-blue" x="725.5" y="227.1" font-size="11.5" text-anchor="middle">if fresh enough</text>
<path class="ln s-orange" d="M810.5,191.5 Q679.0,146.3 547.6,101.2" stroke-width="1.6" marker-end="url(#h-orange)"/>
<text class="s c-orange" x="700.2" y="144.9" font-size="11.5" text-anchor="middle">otherwise</text>

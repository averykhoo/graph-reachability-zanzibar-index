# The full gate in CI (TK122, 2026-10-07): the same ten `formal/verify.sh` phases a local
# session runs (`docs/gate-runbook.md`), one job per phase. verify.sh is the authority;
# this file only provisions a machine and calls it, so the floors, the skip/xfail budget and
# every pin stay defined in exactly one place.
#
#   lean          Lean build + soundness scans + zcli + axiom audit + doc/anchor pins.
#                 Uploads the zcli binary, which every conformance tile needs.
#   conf-tile:i/5 formal/conformance/ (Lean `sem` x oracle x set engine x graph index).
#   tests-tile:i/4 tests/ (no Lean).
#
# Called by publish.yml via `workflow_call` on a release tag, so a release is gated by the
# same definition. Not covered here: the PostgreSQL leg (opt-in locally, see CLAUDE.md).
name: gate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          echo "ZANZIBAR_PY=$(command -v python)" >> "$GITHUB_ENV"

      - name: Install elan (the toolchain itself comes from formal/lean/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The project's own build products only. Mathlib's come prebuilt from its cache
      # below; compiling Mathlib from source would take hours.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: formal/lean/.lake/build
          key: lean-build-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lake-manifest.json') }}-${{ hashFiles('formal/lean/**/*.lean') }}
          restore-keys: |
            lean-build-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lake-manifest.json') }}-

      - name: Fetch prebuilt Mathlib
        working-directory: formal/lean
        run: lake exe cache get

      - name: verify.sh lean
        run: bash formal/verify.sh lean

      - name: Upload zcli
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zcli
          path: formal/lean/.lake/build/bin/zcli
          if-no-files-found: error
          retention-days: 3

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-runs-lean
          path: .gate-runs/
          if-no-files-found: ignore
          retention-days: 14

  conf:
    needs: lean
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tile: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          echo "ZANZIBAR_PY=$(command -v python)" >> "$GITHUB_ENV"

      - name: Download zcli
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zcli
          path: formal/lean/.lake/build/bin

      # upload-artifact does not keep the executable bit.
      - name: Make zcli executable
        run: |
          chmod +x formal/lean/.lake/build/bin/zcli
          ldd formal/lean/.lake/build/bin/zcli || true

      - name: verify.sh conf-tile:${{ matrix.tile }}/5
        run: bash formal/verify.sh conf-tile:${{ matrix.tile }}/5

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-runs-conf-${{ matrix.tile }}
          path: .gate-runs/
          if-no-files-found: ignore
          retention-days: 14

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tile: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          echo "ZANZIBAR_PY=$(command -v python)" >> "$GITHUB_ENV"

      - name: verify.sh tests-tile:${{ matrix.tile }}/4
        run: bash formal/verify.sh tests-tile:${{ matrix.tile }}/4

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-runs-tests-${{ matrix.tile }}
          path: .gate-runs/
          if-no-files-found: ignore
          retention-days: 14

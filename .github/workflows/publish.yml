name: Publish to PyPI

# Tag-triggered (TK122, 2026-10-07), on the same pattern as the sibling repos
# ngram-movers-distance (publish-to-pypi.yml) and python-peass (release.yml). To release:
#
#     # bump __version__ in src/zanzibar/__init__.py AND the newest CHANGELOG.md heading
#     # (tests/test_tk122_release_metadata.py pins them equal), run the local gate, commit
#     git fetch origin master && git log --oneline HEAD..origin/master   # must print nothing
#     git push origin master                     # the BRANCH first, on its own
#     git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z
#
# Two pushes, branch first (2026-10-07): a combined `git push origin master vX.Y.Z` can
# REJECT the branch (remote moved) yet ACCEPT the tag, leaving a release tag on a commit
# that is on no remote branch. validate-tag below refuses that, but it is still a tag to
# clean up. Push the tag by name: --follow-tags pushes annotated tags only, so a
# lightweight `git tag vX.Y.Z` would stay on the laptop and this workflow would never fire.
#
# ⚠ THE FILE NAME (`publish.yml`) AND THE ENVIRONMENT NAME (`pypi`) ARE REGISTERED ON PYPI as
# this project's trusted publisher (2026-10-07). Renaming either breaks the upload, and only
# at the very last step.
#
# workflow_dispatch runs everything EXCEPT the upload, as a repeatable dry run.
# Nothing here ever writes to the repository: no version bump, no commit, no tag,
# no GitHub Release. The tag you push is the only source of truth.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1: cheap guards. Fails in seconds rather than after the gate.
  # ---------------------------------------------------------------------------
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so the ancestry check below can resolve

      # A tag pushed from a side branch would publish code that is not on master.
      # The tag name reaches the script through env: rather than ${{ }} interpolation:
      # git permits $, backticks and parens in a ref name, so interpolating one straight
      # into a run: block is an injection surface.
      - name: Verify tag commit is merged into master
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch origin master:master
          if ! git merge-base --is-ancestor "$TAG" master; then
            echo "::error::Tag $TAG is not in master's history."
            exit 1
          fi

      # setuptools reads the version from src/zanzibar/__init__.py (pyproject `dynamic`).
      # Nothing keeps that in sync with the tag, so check it here -- before anything
      # irreversible. A tag is deletable; a PyPI upload is not.
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(grep -oP "^__version__\s*=\s*['\"]\K[^'\"]+" src/zanzibar/__init__.py)
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          if [ -z "$PKG_VERSION" ]; then
            echo "::error::Could not read __version__ from src/zanzibar/__init__.py."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $PKG_VERSION."
            exit 1
          fi

      # PyPI refuses re-uploads of a version that already exists, even a deleted or yanked
      # one. Without this, re-tagging a published version passes every guard, burns the
      # whole gate, and dies on the last step. Fails closed: anything but a clean 404 stops.
      - name: Verify the version is not already on PyPI
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://pypi.org/pypi/zanzibar-index/$VERSION/json"
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$URL")
          case "$STATUS" in
            404) echo "zanzibar-index $VERSION is not on PyPI yet." ;;
            200) echo "::error::zanzibar-index $VERSION is already on PyPI; it cannot be re-uploaded."
                 exit 1 ;;
            *)   echo "::error::Unexpected HTTP $STATUS from PyPI; refusing to guess."
                 exit 1 ;;
          esac

  # ---------------------------------------------------------------------------
  # STAGE 2: the full gate (all ten verify.sh phases) and the pre-release fuzz sweep.
  # Both are the SAME workflow files that run on master, called -- not copied -- so a
  # release cannot be gated by a stale duplicate.
  # ---------------------------------------------------------------------------
  gate:
    name: Gate
    needs: validate-tag
    permissions:
      contents: read
    uses: ./.github/workflows/gate.yml

  fuzz:
    name: Fuzz
    needs: validate-tag
    permissions:
      contents: read
    uses: ./.github/workflows/fuzz.yml

  # ---------------------------------------------------------------------------
  # STAGE 3: build once, prove it, attest it, ship it.
  #
  # Build/check/attest/publish are steps in ONE job on purpose: the bytes that get
  # smoke-tested and attested are the exact bytes that get uploaded.
  # ---------------------------------------------------------------------------
  deploy:
    name: Publish to PyPI
    needs: [ gate, fuzz ]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zanzibar-index
    permissions:
      id-token: write     # OIDC, for trusted publishing and for attestation
      contents: read
      attestations: write # actions/attest-build-provenance
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build

      - name: Check the metadata
        run: twine check --strict dist/*

      # Installing the built wheel clean is the only thing that catches packaging bugs --
      # a file missing from the wheel is invisible from the source tree. The smoke test IS
      # the PyPI README's quickstart, with each `# True` / `# False` comment turned into an
      # assertion (the same transform tests/test_tk122_release_metadata.py applies), run
      # from an empty directory so nothing can import from the checkout.
      - name: Smoke-test the built wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          mkdir /tmp/smoke-cwd
          cp PYPI_README.md /tmp/smoke-cwd/
          cd /tmp/smoke-cwd
          /tmp/smoke/bin/python - <<'PY'
          import re, pathlib
          import zanzibar
          assert "site-packages" in zanzibar.__file__, zanzibar.__file__
          src = pathlib.Path("PYPI_README.md").read_text(encoding="utf-8")
          blocks = re.findall(r"```python\n(.*?)```", src, re.S)
          assert len(blocks) == 1, len(blocks)
          code, n = re.subn(r"^(\s*)(store\.check\(.*\))\s*#\s*(True|False)\s*$",
                            r"\1assert (\2) is \3", blocks[0], flags=re.M)
          assert n >= 2, n
          exec(compile(code, "quickstart", "exec"), {})
          print("wheel smoke test OK:", zanzibar.__version__, f"({n} checks)")
          PY

      # PEP 740 attestations come from the publish step below. This is the separate
      # GitHub-store provenance, verifiable with `gh attestation verify`, covering both.
      - name: Generate build provenance for both artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      # Dry runs stop here. Everything above has already run.
      - name: Publish to PyPI
        if: github.ref_type == 'tag'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true # PEP 740; the default, pinned explicitly since it is security-relevant

      - name: Dry run summary
        if: github.ref_type != 'tag'
        run: echo "Dry run complete -- gated, fuzzed, built, checked, smoke-tested and attested. Upload skipped." >> "$GITHUB_STEP_SUMMARY"

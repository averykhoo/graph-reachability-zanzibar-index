# pytest configuration -- this file exists to make failures FAIL.
#
# Until 2026-07-27 the repo had no pytest config at all, which silently bought
# every permissive default:
#
#   * `xfail_strict = false` -- a bare `@pytest.mark.xfail` on an always-failing
#     test reports `1 xfailed`, rc 0, and a stale one that starts passing again
#     reports `1 xpassed`, rc 0.  CLAUDE.md's rule that "any strict xfail pins a
#     genuine divergence" rested entirely on authors remembering `strict=True`.
#     There are ZERO live xfail markers in the tree today, so flipping the
#     default costs nothing now and forecloses the shortcut forever.
#   * unregistered markers -- `@pytest.mark.parametrise` (typo), or any marker
#     from a plugin that is not installed, degrades to a warning and the test
#     silently does not do what it says.  `parametrize` is the ONLY marker used
#     anywhere in this repo, so `--strict-markers` is free.
#   * unknown ini keys -- a typo'd setting in THIS file would itself be ignored.
#     `--strict-config` closes that regress.
#
# Deliberately NOT set: a blanket `-W error`.  Third-party deprecation warnings
# (SQLAlchemy, hypothesis) would then redden the gate on an unrelated upgrade,
# which trains people to ignore it.  The `filterwarnings` list below promotes
# only pytest's own "your test is broken" warnings, which are never spurious.
#
# Not set either: `testpaths`.  The gate deliberately invokes `pytest tests/`
# and `pytest formal/conformance/` as separate phases (docs/gate-runbook.md),
# and CLAUDE.md documents bare `pytest` from the root as the whole suite;
# pinning testpaths here would quietly redefine all three.

[pytest]
xfail_strict = true
addopts = --strict-markers --strict-config

filterwarnings =
    error::pytest.PytestUnknownMarkWarning
    error::pytest.PytestCollectionWarning
    error::pytest.PytestReturnNotNoneWarning
    error::pytest.PytestUnraisableExceptionWarning

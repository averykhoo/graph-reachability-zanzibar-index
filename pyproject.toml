# Packaging for the `zanzibar` library (TK120, 2026-10-06; release metadata TK122,
# 2026-10-07). The library is everything under src/zanzibar/; tests/, formal/ (Lean proofs
# + conformance suite), benchmarks/, scripts/ and docs/ are deliberately NOT part of it,
# in the wheel OR the sdist (MANIFEST.in).
#
# The DISTRIBUTION is `zanzibar-index`; the IMPORT package stays `zanzibar` (TK122: the
# bare PyPI name `zanzibar` was free, but the user preferred not to claim it).
#
# The GATE does not depend on this file or on an install: pytest.ini sets
# `pythonpath = src` and formal/verify.sh exports PYTHONPATH=<repo>/src, so every
# checkout/worktree tests its OWN src/. `pip install -e .` is a convenience for
# benchmarks, probes and ad-hoc scripts. requirements.txt stays the environment recipe
# (it also lists the test tools).

[build-system]
# >=77 for the PEP 639 `license` / `license-files` fields below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zanzibar-index"
dynamic = ["version"]
description = "Zanzibar-style relationship/permission evaluation: a set engine and a materialized graph index with identical semantics."
readme = "PYPI_README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Avery Khoo" }]
# 3.13 is the only interpreter the gate runs; lower it only with a test leg that proves it.
requires-python = ">=3.13"
# Floors are the versions the gate runs on (conda env, read 2026-10-07). No upper caps.
dependencies = [
    "sqlmodel>=0.0.39",
    "pyroaring>=1.1.0",
]
keywords = ["zanzibar", "rebac", "authorization", "permissions", "openfga", "acl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/averykhoo/graph-reachability-zanzibar-index"
Source = "https://github.com/averykhoo/graph-reachability-zanzibar-index"
Documentation = "https://averykhoo.github.io/graph-reachability-zanzibar-index/"
Changelog = "https://github.com/averykhoo/graph-reachability-zanzibar-index/blob/master/CHANGELOG.md"

[project.optional-dependencies]
postgres = ["psycopg2-binary"]
test = ["pytest", "hypothesis"]
# The user-docs site (userdocs/, TK151). Also TEST dependencies: tests/test_userdocs_build.py
# runs the strict Sphinx build inside the gate, so requirements.txt carries the same three.
docs = ["sphinx>=8,<9", "myst-parser>=4,<5", "furo"]
# The linter and type checker the gate runs (verify.sh lean, step 4h; TK182). Pinned EXACTLY:
# a new release can add findings, and the gate must not change meaning on its own.
# requirements.txt carries the same two pins.
lint = ["ruff==0.17.3", "mypy==2.4.1"]

[tool.setuptools.dynamic]
# ONE copy of the version: src/zanzibar/__init__.py::__version__.
version = { attr = "zanzibar.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zanzibar = ["py.typed"]

# --- lint + type check (TK182; docs/tk182-lint-typecheck-plan-2026-10-30.md) ---------------
# CORRECTNESS rules only, selected explicitly so a ruff upgrade cannot widen the gate on its
# own: pyflakes (F), syntax errors (E9), bugbear (B), pylint errors (PLE). No style families
# and no `ruff format`: churn for no correctness gain.
[tool.ruff]
target-version = "py313"
extend-exclude = ["formal/lean", "formal/probes", "formal/history", "docs", ".scratch", ".gate-runs", "userdocs/_build"]
# docs/ and formal/probes|history hold dated evidence scripts: frozen, never re-edited.

[tool.ruff.lint]
select = ["F", "E9", "B", "PLE"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files import names to RE-EXPORT them; that is their job.
"**/__init__.py" = ["F401"]

# mypy over the library only (tests, scripts and formal/ are outside the package).
[tool.mypy]
files = ["src/zanzibar"]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
